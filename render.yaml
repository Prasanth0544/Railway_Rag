services:
  - type: web
    name: railway-rag-assistant
    env: python
    region: singapore          # Closest to India
    plan: free
    buildCommand: "chmod +x build.sh && bash build.sh"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75
    envVars:
      - key: GOOGLE_API_KEY
        sync: false            # Set manually in Render dashboard
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: USE_LOCAL_EMBEDDINGS
        value: "false"        # Gemini cloud embeddings (3072-dim) — no local model loaded
      - key: HF_HUB_OFFLINE
        value: "1"             # Block HuggingFace downloads — no local models needed
      - key: TRANSFORMERS_OFFLINE
        value: "1"             # Block transformers model downloads
      - key: PYTHONUNBUFFERED
        value: "1"             # Force logs to flush immediately
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"             # Skip .pyc file generation — saves disk & RAM
      - key: MALLOC_ARENA_MAX
        value: "2"             # Limit glibc memory arenas on Linux — saves ~30-50MB
      - key: RAPIDAPI_KEY
        sync: false            # Optional: set in Render dashboard for reliable live train tracking from cloud IPs
                               # Get free key at: https://rapidapi.com/search/indian%20railway
      - key: CHROMA_TELEMETRY
        value: "FALSE"         # Disable ChromaDB telemetry pings — saves network + RAM overhead

# Memory budget on Render free tier (512MB):
#   Python + FastAPI + libs : ~100MB
#   ChromaDB (rules/trains/stations/references HNSW) : ~100MB
#   train_routes keyword-only (HNSW skipped, saves ~200MB) : ~10MB
#   Response cache + session history : ~20MB
#   Headroom : ~280MB  ← safe under 512MB limit
#
# train_routes uses keyword + exact search only (semantic search skipped
# because its 3072-dim HNSW would cost ~200MB and fails anyway on Render
# due to embedding dimension mismatch vs. the local 384-dim model).
